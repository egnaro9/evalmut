[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalmut"
version = "0.1.0"
description = "Mutation testing for evals: inject known defects into the system under test and report which grader checks stay green. A defect that survives the grader is a hole in the eval, and so is a correct output it flags."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "erik.hill0987@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
  "Intended Audience :: Developers",
]
dependencies = ["gradecore>=0.10.0"]

[project.urls]
Repository = "https://github.com/egnaro9/evalmut"

[project.scripts]
evalmut = "evalmut.cli:main"

[tool.setuptools.packages.find]
include = ["evalmut*"]

[tool.setuptools.package-data]
evalmut = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
